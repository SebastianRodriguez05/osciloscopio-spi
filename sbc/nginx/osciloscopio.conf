# Sitio de nginx del osciloscopio: sirve el dashboard y reenvia /api/ al backend Flask.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/osciloscopio;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
