# Sitio de nginx del osciloscopio: sirve el dashboard y reenvia /api/ al backend Flask.
# Registro de /api/ con la hora en milisegundos ($msec), para medir el periodo de refresco.
log_format tiempos '$msec $remote_addr "$request" $status';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/osciloscopio;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        access_log /var/log/nginx/osciloscopio-api.log tiempos;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
